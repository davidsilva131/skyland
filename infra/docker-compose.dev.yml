services:
  postgres:
    image: postgres:16-alpine
    container_name: skyland-postgres
    environment:
      POSTGRES_USER: skyland
      POSTGRES_PASSWORD: skyland_dev
      POSTGRES_DB: skyland
    ports:
      - "5432:5432"
    volumes:
      - skyland_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyland"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skyland_pgdata: